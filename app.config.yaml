# Firefly Assembly MCP server - Adobe I/O Runtime application configuration

application:
  actions: actions
  # Static assets (Spectrum bundle used by the MCP App views), served by App Builder static hosting
  web:
    src: web-src
    response-headers:
      /*.js:
        # The views load the bundle as a module script from sandboxed iframes, which requires CORS
        Access-Control-Allow-Origin: '*'
        # File names carry a content hash, so they can be cached for long
        cache-control: public, max-age=31536000, immutable
  hooks:
    # Builds the bundle into web-src and publishes web-src as is, instead of the default Parcel build
    build-static: ui/build-static.js
  runtimeManifest:
    packages:
      firefly-assembly:
        actions:
          # MCP server, served at /api/v1/web/firefly-assembly/mcp-server
          mcp-server:
            function: actions/mcp-server/index.js
            web: 'yes'
            runtime: 'nodejs:20'
            limits:
              # 5 minutes, for long Photoshop API jobs
              timeout: 300000
              memory: 1024
            inputs:
              # debug, info, warn or error
              LOG_LEVEL: debug
              # Firefly Services server-to-server credentials used to call the Photoshop API
              FIREFLY_SERVICES_API_CLIENT_ID: $FIREFLY_SERVICES_API_CLIENT_ID
              FIREFLY_SERVICES_API_CLIENT_SECRET: $FIREFLY_SERVICES_API_CLIENT_SECRET
              FIREFLY_SERVICES_API_SCOPES: $FIREFLY_SERVICES_API_SCOPES
              # Optional AEM Assets repositories browsed with the Asset Selector: one (e.g. author-p12345-e67890.adobeaemcloud.com),
              # several comma-separated, or '*' for any AEM as a Cloud Service repository the user can access.
              # Leave empty to only allow local uploads.
              AEM_REPOSITORY_ID: $AEM_REPOSITORY_ID
              # Tier browsed by the selector: delivery (default, approved assets) or author
              AEM_TIER: $AEM_TIER
            annotations:
              # The action validates the Adobe IMS token itself (validator.js) and serves the OAuth metadata
              require-adobe-auth: false
              final: true
              # Raw request body, as the MCP transport expects
              raw-http: true
